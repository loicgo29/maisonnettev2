version: '3.9'

services:
  postgres-maisonnettev2:
    image: postgres:16-alpine
    container_name: postgres-maisonnettev2
    environment:
      POSTGRES_USER: maisonnettev2
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant — voir .env.example}
      POSTGRES_DB: maisonnettev2
    volumes:
      - maisonnettev2_pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maisonnettev2"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - maisonnettev2-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maisonnettev2-backend
    environment:
      # ── Configuration ──────────────────────────────────────────────
      # Écrite ici, versionnée, relue en revue. Ces valeurs ne sont pas
      # secrètes : les cacher dans un fichier local les faisait diverger d'une
      # machine à l'autre sans que rien ne le signale.
      NODE_ENV: development
      PORT: 3001
      DB_USER: maisonnettev2
      DB_NAME: maisonnettev2
      SENTRY_ENVIRONMENT: development
      OWNER_EMAIL: contact@maisonnette-pecheur-bertheaume.fr
      OWNER_PHONE: '+33781103889'
      # Realm applicatif, jamais `master` : ce dernier est celui de
      # l'administration de Keycloak. `host.docker.internal` car Keycloak vit
      # dans le compose du projet idp, sur un autre réseau Docker.
      KEYCLOAK_REALM_URL: http://host.docker.internal:9001/realms/maisonnettev2
      # Keycloak s'annonce en `localhost` dans les jetons qu'il émet, alors que
      # le conteneur le joint par `host.docker.internal`. Sans cette précision,
      # le contrôle de l'émetteur rejetterait tous les jetons, valides compris.
      KEYCLOAK_ISSUER: http://localhost:9001/realms/maisonnettev2
      # Identifiant OAuth public : il figure déjà dans l'authUrl que renvoie
      # /api/calendar, le traiter en secret n'apportait rien.
      PRIVATE_GOOGLE_CLIENT_ID: 775094963614-ajspquocfsq0e5qpnlfm0leniia83iij.apps.googleusercontent.com
      PRIVATE_GOOGLE_REDIRECT_URI: http://localhost:3001/api/calendar/callback
      PUBLIC_CALENDAR_ID: ${PUBLIC_CALENDAR_ID:-}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER:-}
      MESSAGES_AUTO: 'false'

      # ── Secrets ────────────────────────────────────────────────────
      # Jamais de valeur par défaut : `:?` fait échouer docker compose avec un
      # message clair plutôt que de démarrer sur une chaîne vide. Ils vivent
      # dans .env, hors du dépôt.
      DATABASE_URL: postgresql://maisonnettev2:${DB_PASSWORD:?DB_PASSWORD manquant — voir .env.example}@postgres-maisonnettev2:5432/maisonnettev2
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant — voir .env.example}
      # Facultatifs : absents, la fonctionnalité correspondante se tait.
      PRIVATE_GOOGLE_CLIENT_SECRET: ${PRIVATE_GOOGLE_CLIENT_SECRET:-}
      PRIVATE_GITE_CALENDAR_ID: ${PRIVATE_GITE_CALENDAR_ID:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
    ports:
      - "3001:3001"
    depends_on:
      postgres-maisonnettev2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - maisonnettev2-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.nginx
      # SvelteKit fige ces valeurs dans le paquet construit : elles doivent
      # arriver ici, pas dans `environment` qui n'agit qu'au démarrage.
      args:
        # C'est le navigateur qui suit cette URL : localhost, jamais un nom de
        # conteneur. Realm applicatif, jamais `master`.
        PUBLIC_AUTH_URL: http://localhost:9001
        PUBLIC_AUTH_REALM: maisonnettev2
        PUBLIC_AUTH_CLIENT_ID: maisonnettev2-frontend
    container_name: maisonnettev2-frontend
    environment:
      # Configuration
      PRIVATE_GOOGLE_CLIENT_ID: 775094963614-ajspquocfsq0e5qpnlfm0leniia83iij.apps.googleusercontent.com
      PRIVATE_GOOGLE_REDIRECT_URI: http://localhost:3001/api/calendar/callback
      # Secrets, tous facultatifs ici
      PRIVATE_GOOGLE_CLIENT_SECRET: ${PRIVATE_GOOGLE_CLIENT_SECRET:-}
      PRIVATE_GITE_CALENDAR_ID: ${PRIVATE_GITE_CALENDAR_ID:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      PUBLIC_CALENDAR_ID: ${PUBLIC_CALENDAR_ID:-}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - maisonnettev2-net

  # alo — comptabilité familiale, servie par maisonnettev2 derrière
  # l'authentification du backoffice.
  #
  # Code source rapatrié dans ce repo (alo-backend/, alo-frontend/) le
  # 2026-09-07 — buildé localement, plus d'image externe. L'ancien dépôt alo
  # standalone (avec sa propre base SQLite/Postgres locale) reste sur le Mac
  # mini pour référence, mais n'est plus la source de vérité du code ; les
  # deux jeux de données restent séparés jusqu'à décision de nettoyage.
  #
  # Les noms de service restent `alo-backend` et `alo-frontend` : le nginx
  # embarqué dans l'image du frontend proxifie /api vers `alo-backend:8000` en
  # dur, et ces noms lui servent d'alias réseau. Seuls les container_name
  # diffèrent, pour ne pas entrer en conflit avec l'ancien projet alo
  # standalone encore présent sur cette machine.
  alo-backend:
    build:
      context: ./alo-backend
      dockerfile: Dockerfile
    container_name: maisonnettev2-alo-backend
    restart: unless-stopped
    environment:
      # `search_path` est le seul mécanisme par lequel alo choisit son schéma :
      # rien dans son code Python ne le qualifie.
      DATABASE_URL: postgresql+psycopg2://maisonnettev2:${DB_PASSWORD:?DB_PASSWORD manquant — voir .env.example}@postgres-maisonnettev2:5432/maisonnettev2?options=-csearch_path%3Dalo
      API_HOST: 0.0.0.0
      API_PORT: 8000
      ENVIRONMENT: production
      DEBUG: 'false'
    depends_on:
      postgres-maisonnettev2:
        condition: service_healthy
    volumes:
      - alo_data:/app/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:8000/docs']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - maisonnettev2-net

  # Bot Telegram alo — process séparé (même image que alo-backend, commande différente).
  # Migré depuis le repo alo standalone le 2026-09-08 (voir CLAUDE.md alo-backend et
  # mémoire auto migration_base_alo_vers_maisonnettev2). Poste les dépenses via l'API
  # interne (alo-backend:8000/api/imports/telegram), pas d'accès direct à la base.
  alo-telegram-bot:
    build:
      context: ./alo-backend
      dockerfile: Dockerfile
    container_name: maisonnettev2-alo-telegram-bot
    command: ['uv', 'run', 'python', '-m', 'telegram_bot.bot']
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN manquant — voir .env.example}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      API_BASE_URL: http://alo-backend:8000
    depends_on:
      alo-backend:
        condition: service_healthy
    networks:
      - maisonnettev2-net

  alo-frontend:
    build:
      context: ./alo-frontend
      dockerfile: Dockerfile
    container_name: maisonnettev2-alo-frontend
    restart: unless-stopped
    depends_on:
      - alo-backend
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:80/']
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - maisonnettev2-net

  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile
    container_name: maisonnettev2-caddy
    ports:
      - "8030:80"
    depends_on:
      - backend
      - frontend
      - alo-frontend
    networks:
      - maisonnettev2-net
    volumes:
      - maisonnettev2_caddy_data:/data
      - maisonnettev2_caddy_config:/config

  tests:
    build:
      context: .
      dockerfile: tests/Dockerfile
    container_name: maisonnettev2-tests
    environment:
      DB_USER: maisonnettev2
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant — voir .env.example}
      DB_NAME: maisonnettev2
      DB_HOST: postgres-maisonnettev2
      NODE_ENV: development
      VITE_API_URL: http://backend:3001
    depends_on:
      backend:
        condition: service_healthy
      postgres-maisonnettev2:
        condition: service_healthy
    networks:
      - maisonnettev2-net
    profiles:
      - test

volumes:
  maisonnettev2_pg_data:
  maisonnettev2_caddy_data:
  maisonnettev2_caddy_config:
  # Session Telegram et règles de catégorisation apprises par alo.
  alo_data:

networks:
  maisonnettev2-net:
    driver: bridge
