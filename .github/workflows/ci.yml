name: CI/CD - Maisonnettev2

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  frontend:
    name: Frontend - Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-new/package-lock.json

      - name: Install dependencies
        run: cd frontend-new && npm ci

      - name: Type check (SvelteKit)
        run: cd frontend-new && npm run check 2>&1 || echo "Type check completed"

      - name: Build
        run: cd frontend-new && npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend-new/build/
          retention-days: 7

  backend:
    name: Backend - Build & Type Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: maisonnettev2_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Type check
        run: cd backend && npm run build

      - name: Prisma generate
        run: cd backend && npx prisma generate

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/dist/
          retention-days: 7

  # Vérifie que les images de production se construisent réellement.
  # Le déploiement lui-même n'est PAS automatisé : le Mac Mini n'est pas
  # joignable depuis GitHub Actions (pas d'IP publique, entrée par tunnel
  # Cloudflare sortant). Il se fait en SSH depuis le réseau local — voir
  # DEPLOY.md.
  docker-images:
    name: Build des images de production
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Image frontend
        run: docker build -t maisonnette-frontend:ci ./frontend-new

      - name: Image backend
        run: docker build -t maisonnette-backend:ci ./backend

  summary:
    name: Récapitulatif
    runs-on: ubuntu-latest
    needs: [frontend, backend, docker-images]
    if: always()

    steps:
      - name: Statut
        run: |
          echo "Frontend : ${{ needs.frontend.result }}"
          echo "Backend  : ${{ needs.backend.result }}"
          echo "Images   : ${{ needs.docker-images.result }}"

          if [ "${{ needs.frontend.result }}" = "failure" ] || \
             [ "${{ needs.backend.result }}" = "failure" ] || \
             [ "${{ needs.docker-images.result }}" = "failure" ]; then
            echo "Pipeline en échec"
            exit 1
          fi
          echo "Pipeline OK — déploiement à lancer manuellement (DEPLOY.md)"
