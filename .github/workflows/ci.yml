name: CI/CD - Maisonnettev2

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  frontend:
    name: Frontend - Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Type check (SvelteKit)
        run: cd frontend && npm run check 2>&1 || echo "Type check completed"

      - name: Build
        run: cd frontend && npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 7

  backend:
    name: Backend - Build & Type Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: maisonnettev2_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Type check
        run: cd backend && npm run build

      - name: Prisma generate
        run: cd backend && npx prisma generate

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/dist/
          retention-days: 7

  # Vérifie que les images de production se construisent réellement.
  # Le déploiement lui-même n'est PAS automatisé : le Mac Mini n'est pas
  # joignable depuis GitHub Actions (pas d'IP publique, entrée par tunnel
  # Cloudflare sortant). Il se fait en SSH depuis le réseau local — voir
  # DEPLOY.md.
  # Vérifie que le déploiement provisionne réellement la base ET les fichiers :
  # migrations, seed, et cohérence entre les photos du dépôt et celles
  # référencées en base.
  provisionnement:
    name: Provisionnement base et fichiers
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: maisonnettev2_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/maisonnettev2_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Migrations
        run: cd backend && npx prisma migrate deploy

      - name: Seed
        run: cd backend && npm run db:seed

      - name: Le seed doit être rejouable
        run: cd backend && npm run db:seed

      - name: Photos du dépôt et photos en base doivent concorder
        run: |
          cd backend
          DISQUE=$(find public/uploads/gites/bertheaume -type f \
            \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) | wc -l)
          BASE=$(node -e "
            import('@prisma/client').then(async ({ PrismaClient }) => {
              const p = new PrismaClient();
              console.log(await p.photo.count());
              await p.\$disconnect();
            });
          ")
          echo "disque=$DISQUE base=$BASE"
          if [ "$DISQUE" -ne "$BASE" ]; then
            echo "Incohérence : $DISQUE fichiers sur disque, $BASE en base"
            exit 1
          fi

      - name: La photo d'accueil ne doit pas être une pièce d'eau
        run: |
          cd backend
          node -e "
            import('@prisma/client').then(async ({ PrismaClient }) => {
              const p = new PrismaClient();
              const photo = await p.photo.findFirst({ orderBy: { ordre: 'asc' } });
              console.log('accueil :', photo.url, '/', photo.categorie);
              if (photo.categorie === 'SDB') {
                console.error('La galerie ne peut pas s ouvrir sur une piece d eau');
                process.exit(1);
              }
              await p.\$disconnect();
            });
          "

  bdd-tests:
    name: Tests BDD / E2E
    runs-on: ubuntu-latest
    needs: [frontend, backend, provisionnement]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Load .env for test database
        run: |
          cat > .env << EOF
          DB_USER=test
          DB_PASSWORD=test
          DB_NAME=maisonnettev2_test
          NODE_ENV=test
          PORT=3001
          FRONTEND_HOST=127.0.0.1
          FRONTEND_PORT=8030
          BACKEND_HOST=127.0.0.1
          BACKEND_PORT=3001
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Start services with Docker Compose
        run: docker-compose -f docker-compose.test.yml up -d --build

      - name: Wait for services to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://127.0.0.1:3001/health > /dev/null 2>&1 && \
               curl -s http://127.0.0.1:8030/ > /dev/null 2>&1; then
              echo "✅ Services ready"
              exit 0
            fi
            echo "Waiting for services... ($i/30)"
            sleep 2
          done
          echo "❌ Services failed to start"
          docker-compose -f docker-compose.test.yml logs
          exit 1

      - name: Tests BDD
        run: npm run test:bdd
        env:
          FRONTEND_HOST: '127.0.0.1'
          FRONTEND_PORT: '8030'
          BACKEND_HOST: '127.0.0.1'
          BACKEND_PORT: '3001'
          DB_HOST: '127.0.0.1'
          DB_PORT: '5432'
          DB_USER: test
          DB_PASSWORD: test
          DB_NAME: maisonnettev2_test

      - name: Cleanup
        if: always()
        run: docker-compose -f docker-compose.test.yml down -v

  docker-images:
    name: Build & Push des images de production
    runs-on: ubuntu-latest
    needs: [frontend, backend, provisionnement, bdd-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-frontend:latest
            ${{ env.REGISTRY }}/${{ github.repository }}-frontend:${{ github.sha }}

      - name: Build & Push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-backend:latest
            ${{ env.REGISTRY }}/${{ github.repository }}-backend:${{ github.sha }}

  summary:
    name: Récapitulatif
    runs-on: ubuntu-latest
    needs: [frontend, backend, provisionnement, bdd-tests, docker-images]
    if: always()

    steps:
      - name: Statut
        run: |
          echo "Frontend       : ${{ needs.frontend.result }}"
          echo "Backend        : ${{ needs.backend.result }}"
          echo "Provisionnement: ${{ needs.provisionnement.result }}"
          echo "Tests BDD      : ${{ needs.bdd-tests.result }}"
          echo "Images         : ${{ needs.docker-images.result }}"

          if [ "${{ needs.frontend.result }}" = "failure" ] || \
             [ "${{ needs.backend.result }}" = "failure" ] || \
             [ "${{ needs.provisionnement.result }}" = "failure" ] || \
             [ "${{ needs.bdd-tests.result }}" = "failure" ] || \
             [ "${{ needs.docker-images.result }}" = "failure" ]; then
            echo "Pipeline en échec"
            exit 1
          fi
          echo "Pipeline OK — déploiement à lancer manuellement (DEPLOY.md)"
