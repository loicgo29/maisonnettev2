name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Type check
        run: cd frontend && npm run type-check

      - name: Lint
        run: cd frontend && npm run lint

      - name: Unit tests
        run: cd frontend && npm run test -- --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./frontend/coverage/coverage-final.json
          flags: frontend

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps

      - name: E2E tests
        run: cd frontend && npm run test:e2e

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 30

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: maisonnettev2_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Setup test database
        run: |
          cd backend
          DATABASE_URL="postgresql://test:test@localhost:5432/maisonnettev2_test" npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/maisonnettev2_test

      - name: Type check
        run: cd backend && npm run type-check

      - name: Lint
        run: cd backend && npm run lint

      - name: Unit & Integration tests
        run: cd backend && npm run test -- --coverage
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/maisonnettev2_test

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage/coverage-final.json
          flags: backend

      - name: BDD tests
        run: cd backend && npx cucumber-js features/ --format json:test-results/cucumber.json
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/maisonnettev2_test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: backend/test-results/
          retention-days: 30

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Frontend dependencies audit
        run: cd frontend && npm audit --audit-level=moderate
        continue-on-error: true

      - name: Backend dependencies audit
        run: cd backend && npm audit --audit-level=moderate
        continue-on-error: true

      - name: SAST scanning (if added)
        run: echo "SAST scanning placeholder"

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [frontend, backend, security]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.frontend.result }}" = "failure" ] || [ "${{ needs.backend.result }}" = "failure" ]; then
            echo "❌ Tests failed"
            exit 1
          fi
          echo "✅ All tests passed"
