name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy maisonnettev2 to Hetzner
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Generate .env.production from Bitwarden secrets
        env:
          PRIVATE_GOOGLE_CLIENT_ID: ${{ secrets.PRIVATE_GOOGLE_CLIENT_ID }}
          PRIVATE_GOOGLE_CLIENT_SECRET: ${{ secrets.PRIVATE_GOOGLE_CLIENT_SECRET }}
          PRIVATE_GOOGLE_REDIRECT_URI: ${{ secrets.PRIVATE_GOOGLE_REDIRECT_URI }}
          PRIVATE_GITE_CALENDAR_ID: ${{ secrets.PRIVATE_GITE_CALENDAR_ID }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          KC_DB_PASSWORD: ${{ secrets.KC_DB_PASSWORD }}
          KC_ADMIN_PASSWORD: ${{ secrets.KC_ADMIN_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          cat > .env.production << 'ENVEOF'
          DB_USER=maisonnettev2
          DB_PASSWORD=${{ env.DB_PASSWORD }}
          DB_NAME=maisonnettev2
          # Sans JWT_SECRET, src/middleware/backoffice-jwt.ts interrompt le
          # démarrage en production et le backend boucle sur un redémarrage.
          JWT_SECRET=${{ env.JWT_SECRET }}
          NODE_ENV=production
          PORT=3001
          VITE_API_URL=https://maisonnette-pecheur-bertheaume.fr
          OWNER_EMAIL=lgbertheaume@gmail.com
          OWNER_PHONE=+33781103889

          DOMAIN=maisonnette-pecheur-bertheaume.fr
          PUBLIC_ORIGIN=https://maisonnette-pecheur-bertheaume.fr
          ACME_EMAIL=loic@logo-solutions.fr
          PUBLIC_AUTH_URL=https://auth.maisonnette-pecheur-bertheaume.fr
          PUBLIC_AUTH_REALM=maisonnettev2
          PUBLIC_AUTH_CLIENT_ID=maisonnettev2-frontend

          FRONTEND_HOST=127.0.0.1
          FRONTEND_PORT=8030
          BACKEND_HOST=127.0.0.1
          BACKEND_PORT=3001
          DB_HOST=postgres
          DB_PORT=5432

          KC_DB_PASSWORD=${{ env.KC_DB_PASSWORD }}
          KC_ADMIN_USER=admin
          KC_ADMIN_PASSWORD=${{ env.KC_ADMIN_PASSWORD }}
          KEYCLOAK_REALM_URL=https://auth.maisonnette-pecheur-bertheaume.fr/realms/maisonnettev2/
          MESSAGES_AUTO=false

          RESEND_API_KEY=${{ env.RESEND_API_KEY }}

          PRIVATE_GOOGLE_CLIENT_ID=${{ env.PRIVATE_GOOGLE_CLIENT_ID }}
          PRIVATE_GOOGLE_CLIENT_SECRET=${{ env.PRIVATE_GOOGLE_CLIENT_SECRET }}
          PRIVATE_GOOGLE_REDIRECT_URI=${{ env.PRIVATE_GOOGLE_REDIRECT_URI }}
          PRIVATE_GITE_CALENDAR_ID=${{ env.PRIVATE_GITE_CALENDAR_ID }}
          ENVEOF

          echo "✅ .env.production generated"

      - name: Verify .env.production integrity
        run: |
          echo "✓ Verifying .env.production..."
          required_vars=(
            "PRIVATE_GOOGLE_CLIENT_ID"
            "PRIVATE_GOOGLE_CLIENT_SECRET"
            "PRIVATE_GOOGLE_REDIRECT_URI"
            "PRIVATE_GITE_CALENDAR_ID"
            "DB_PASSWORD"
            "JWT_SECRET"
            "KC_DB_PASSWORD"
            "KC_ADMIN_PASSWORD"
            "KEYCLOAK_REALM_URL"
            "DOMAIN"
            "ACME_EMAIL"
          )
          for var in "${required_vars[@]}"; do
            if ! grep -q "^${var}=" .env.production; then
              echo "❌ Missing: ${var}"
              exit 1
            fi
          done
          echo "✅ All critical env vars present"

      - name: Deploy via SSH
        env:
          DEPLOY_KEY: ${{ secrets.HETZNER_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.HETZNER_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.HETZNER_DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          # Transfer .env.production to server
          scp -i ~/.ssh/deploy_key .env.production "$DEPLOY_USER@$DEPLOY_HOST:/tmp/.env.production"

          # Les options de keepalive ne sont pas décoratives : la construction
          # des images occupe les deux cœurs du serveur pendant plusieurs
          # minutes sans rien écrire sur le canal, et la session tombait en
          # « Broken pipe » avant la fin, laissant le déploiement à moitié fait.
          ssh -i ~/.ssh/deploy_key \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=240 \
            -o TCPKeepAlive=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" << 'EOF'
          set -euo pipefail
          cd /opt/maisonnettev2

          echo "=== PRE-DEPLOYMENT CHECKS ==="

          # Verify .env was transferred
          if [ ! -f /tmp/.env.production ]; then
            echo "❌ .env.production transfer failed"
            exit 1
          fi
          echo "✓ .env.production transferred"

          # Save current .env if exists (backup)
          [ -f .env ] && cp .env .env.backup || true

          # Move new .env.production to .env
          mv /tmp/.env.production .env

          # Verify critical vars are present on production
          for var in PRIVATE_GOOGLE_CLIENT_ID PRIVATE_GOOGLE_REDIRECT_URI KEYCLOAK_REALM_URL; do
            if ! grep -q "^${var}=" .env; then
              echo "❌ Production .env missing: ${var}"
              exit 1
            fi
          done
          echo "✓ All env vars verified on production"

          # Download and extract code from GitHub
          curl -L -o code.tar.gz \
            ${{ github.server_url }}/${{ github.repository }}/archive/${{ github.ref_name }}.tar.gz
          tar -xzf code.tar.gz --strip-components=1
          rm -f code.tar.gz
          echo "✓ Code synced"

          # Deploy WITH NO-CACHE to force rebuild with new env vars
          echo "=== DEPLOYING (NO-CACHE, WITH --env-file) ==="

          # CRITICAL: Rebuild with --env-file (MUST come before -f)
          # `backoffice` et `backend` sont les deux seuls services construits
          # ici : `public` part de l'image nginx officielle et ne monte que
          # public-site/. Le service `frontend` n'existe plus depuis la
          # séparation site public / backoffice, et le nommer faisait échouer
          # le déploiement sur « no such service ».
          # Pas de --no-cache : le serveur n'a que deux cœurs et reconstruire
          # les deux images de zéro le saturait (load > 90) au point de couper
          # la session SSH. Docker invalide déjà les couches concernées dès que
          # les sources ou les variables de construction changent.
          echo "🔨 Rebuilding backend + backoffice with environment variables..."
          docker compose \
            --env-file .env \
            -f docker-compose.prod.yml \
            build backend backoffice

          echo ""
          echo "🚀 Starting services..."
          # --remove-orphans retire les conteneurs des anciennes révisions du
          # compose (maisonnette-frontend, maisonnette-db). Les données ne sont
          # pas concernées : elles vivent dans le volume nommé
          # maisonnettev2_postgres_data, que le service postgres réutilise.
          docker compose --env-file .env -f docker-compose.prod.yml up -d --remove-orphans

          echo ""
          echo "🗄️ Applying database migrations..."
          docker compose --env-file .env -f docker-compose.prod.yml \
            exec -T backend npx prisma migrate deploy

          echo "✅ Deployment complete"
          EOF

      - name: Post-Deployment Healthchecks
        env:
          DEPLOY_HOST: ${{ secrets.HETZNER_DEPLOY_HOST }}
        run: |
          echo "⏳ Waiting for services to be healthy..."
          sleep 10

          # Caddy de production n'écoute que 80/443 : interroger le port 8030
          # échouait systématiquement. On passe par le domaine, seule façon
          # d'obtenir le bon site (Caddy route sur l'en-tête Host).
          SITE="https://maisonnette-pecheur-bertheaume.fr"

          max_attempts=30
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            if curl -fsS "$SITE/api/health" > /dev/null 2>&1; then
              echo "✅ Backend health check passed"
              break
            fi
            if [ $attempt -eq $max_attempts ]; then
              echo "❌ Backend health check failed after $max_attempts attempts"
              exit 1
            fi
            echo "⏳ Attempt $attempt/$max_attempts..."
            sleep 2
            ((attempt++))
          done

          # Le backoffice doit répondre, sinon le site public est en ligne mais
          # l'administration est inaccessible sans que rien ne le signale.
          echo "✓ Testing backoffice login page..."
          if curl -fsS "$SITE/backoffice/login" | grep -q "Backoffice Login"; then
            echo "✅ Backoffice login page served"
          else
            echo "❌ Backoffice login page unreachable"
            exit 1
          fi

          # Check Google Calendar OAuth2 configuration
          echo "✓ Testing Google Calendar OAuth2 configuration..."
          calendar_response=$(curl -s "$SITE/api/calendar")
          if echo "$calendar_response" | grep -q "authUrl"; then
            if echo "$calendar_response" | grep -q "$DEPLOY_HOST/api/calendar/callback"; then
              echo "✅ Google Calendar REDIRECT_URI correctly configured"
            else
              echo "⚠️ Warning: REDIRECT_URI may not be correct"
            fi
          else
            echo "❌ Calendar endpoint not responding correctly"
            exit 1
          fi

          echo ""
          echo "========================================="
          echo "✅ ALL DEPLOYMENT CHECKS PASSED"
          echo "========================================="
