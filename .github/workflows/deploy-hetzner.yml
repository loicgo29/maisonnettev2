name: Deploy to Hetzner

on:
  # Déclenché par la réussite de la CI, et non par la poussée : celle-ci
  # lançait les deux en parallèle, si bien qu'on déployait sans attendre les
  # tests — et, depuis le passage au registre, on tirerait une image que la CI
  # n'a pas encore publiée.
  workflow_run:
    workflows: ['CI/CD - Maisonnettev2']
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy maisonnettev2 to Hetzner
    runs-on: ubuntu-latest
    # Un déclenchement manuel n'a pas de workflow_run : on l'accepte aussi.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      # Nécessaire pour tirer les images depuis ghcr.io.
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Generate .env.production from Bitwarden secrets
        env:
          PRIVATE_GOOGLE_CLIENT_ID: ${{ secrets.PRIVATE_GOOGLE_CLIENT_ID }}
          PRIVATE_GOOGLE_CLIENT_SECRET: ${{ secrets.PRIVATE_GOOGLE_CLIENT_SECRET }}
          PRIVATE_GOOGLE_REDIRECT_URI: ${{ secrets.PRIVATE_GOOGLE_REDIRECT_URI }}
          PRIVATE_GITE_CALENDAR_ID: ${{ secrets.PRIVATE_GITE_CALENDAR_ID }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          KC_DB_PASSWORD: ${{ secrets.KC_DB_PASSWORD }}
          KC_ADMIN_PASSWORD: ${{ secrets.KC_ADMIN_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MAREE_API_KEY: ${{ secrets.MAREE_API_KEY }}
        run: |
          # Seuls les secrets sont transmis au serveur : toute la configuration
          # — domaine, realm, contacts, identifiants publics — vit désormais
          # dans docker-compose.prod.yml, versionnée et relue en revue.
          #
          # Ce fichier contenait auparavant 31 lignes, dont l'essentiel n'était
          # pas secret. Les valeurs y devenaient invisibles : une URL de realm
          # Authentik y a survécu des semaines sans que personne ne la voie.
          cat > .env.production << 'ENVEOF'
          DB_PASSWORD=${{ env.DB_PASSWORD }}
          JWT_SECRET=${{ env.JWT_SECRET }}
          PRIVATE_GOOGLE_CLIENT_SECRET=${{ env.PRIVATE_GOOGLE_CLIENT_SECRET }}
          PRIVATE_GITE_CALENDAR_ID=${{ env.PRIVATE_GITE_CALENDAR_ID }}
          RESEND_API_KEY=${{ env.RESEND_API_KEY }}
          KC_DB_PASSWORD=${{ env.KC_DB_PASSWORD }}
          KC_ADMIN_PASSWORD=${{ env.KC_ADMIN_PASSWORD }}
          TELEGRAM_BOT_TOKEN=${{ env.TELEGRAM_BOT_TOKEN }}
          MAREE_API_KEY=${{ env.MAREE_API_KEY }}
          ENVEOF

          echo "✅ .env.production generated"

      - name: Verify .env.production integrity
        run: |
          echo "✓ Verifying .env.production..."
          # Les seules variables encore attendues sont les secrets : le reste
          # est dans le compose, où une absence se voit à la lecture.
          required_vars=(
            "DB_PASSWORD"
            "JWT_SECRET"
            "KC_DB_PASSWORD"
            "KC_ADMIN_PASSWORD"
          )
          for var in "${required_vars[@]}"; do
            if ! grep -q "^${var}=" .env.production; then
              echo "❌ Missing: ${var}"
              exit 1
            fi
          done
          echo "✅ All critical env vars present"

      - name: Deploy via SSH
        env:
          DEPLOY_KEY: ${{ secrets.HETZNER_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.HETZNER_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.HETZNER_DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          # Transfer .env.production to server
          scp -i ~/.ssh/deploy_key .env.production "$DEPLOY_USER@$DEPLOY_HOST:/tmp/.env.production"

          # Les options de keepalive ne sont pas décoratives : la construction
          # des images occupe les deux cœurs du serveur pendant plusieurs
          # minutes sans rien écrire sur le canal, et la session tombait en
          # « Broken pipe » avant la fin, laissant le déploiement à moitié fait.
          ssh -i ~/.ssh/deploy_key \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=240 \
            -o TCPKeepAlive=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" << 'EOF'
          set -euo pipefail
          cd /opt/maisonnettev2

          echo "=== PRE-DEPLOYMENT CHECKS ==="

          # Verify .env was transferred
          if [ ! -f /tmp/.env.production ]; then
            echo "❌ .env.production transfer failed"
            exit 1
          fi
          echo "✓ .env.production transferred"

          # Save current .env if exists (backup)
          [ -f .env ] && cp .env .env.backup || true

          # Move new .env.production to .env
          mv /tmp/.env.production .env

          # Le .env ne porte plus que des secrets : la configuration est dans
          # le compose, où docker échoue de lui-même sur une variable absente
          # grâce aux `${VAR:?message}`. Vérifier ici les variables de
          # configuration ferait échouer le déploiement pour une valeur qui a
          # simplement changé de place.
          for var in DB_PASSWORD JWT_SECRET KC_DB_PASSWORD KC_ADMIN_PASSWORD; do
            if ! grep -q "^${var}=" .env; then
              echo "❌ Production .env missing: ${var}"
              exit 1
            fi
          done
          echo "✓ Secrets verified on production"

          # Download and extract code from GitHub
          curl -L -o code.tar.gz \
            ${{ github.server_url }}/${{ github.repository }}/archive/${{ github.ref_name }}.tar.gz
          tar -xzf code.tar.gz --strip-components=1
          rm -f code.tar.gz
          echo "✓ Code synced"

          # Deploy WITH NO-CACHE to force rebuild with new env vars
          echo "=== DEPLOYING (NO-CACHE, WITH --env-file) ==="

          # Debug: verify .env has JWT_SECRET before docker compose starts
          echo "🔍 Verifying .env contains JWT_SECRET..."
          if grep -q "^JWT_SECRET=" .env; then
            echo "✓ JWT_SECRET found in .env"
          else
            echo "❌ JWT_SECRET NOT FOUND in .env - this will cause backend to fail"
            echo "File contents:"
            cat .env
            exit 1
          fi

          # Les images viennent du registre : le serveur n'a que deux cœurs, et
          # les construire ici l'a saturé jusqu'à couper la session SSH en
          # « Broken pipe », laissant un déploiement à moitié fait. La CI les
          # bâtit une fois, sur des machines faites pour ça.
          echo "📥 Récupération des images publiées par la CI..."
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker compose --env-file .env -f docker-compose.prod.yml pull backend backoffice alo-backend alo-frontend

          echo ""
          echo "🚀 Starting services..."
          # --remove-orphans retire les conteneurs des anciennes révisions du
          # compose (maisonnette-frontend, maisonnette-db). Les données ne sont
          # pas concernées : elles vivent dans le volume nommé
          # maisonnettev2_postgres_data, que le service postgres réutilise.
          docker compose --env-file .env -f docker-compose.prod.yml up -d --remove-orphans

          # Caddy monte son Caddyfile en lecture seule : `up -d` ne le recrée
          # pas quand seul ce fichier a changé, et le routage reste celui d'avant
          # — un bloc ajouté demeure invisible sans que rien ne le signale.
          echo "🔁 Rechargement de la configuration de Caddy..."
          docker compose --env-file .env -f docker-compose.prod.yml up -d --force-recreate caddy

          echo ""
          echo "⏳ Waiting for backend to be healthy..."
          # node, pas curl : l'image backend (node:20-alpine + openssl
          # seulement) n'embarque pas curl, comme le healthcheck Docker du
          # même service le fait déjà plus haut dans ce compose. La sonde ici
          # utilisait encore curl et échouait donc à chaque déploiement, exec
          # introuvable, alors que le backend démarrait très bien.
          for i in {1..30}; do
            if docker compose --env-file .env -f docker-compose.prod.yml exec -T backend node -e "require('http').get('http://127.0.0.1:3001/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))" > /dev/null 2>&1; then
              echo "✅ Backend is healthy"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "❌ Backend failed to become healthy"
              docker compose --env-file .env -f docker-compose.prod.yml logs backend | tail -50
              exit 1
            fi
            echo "  Attempt $i/30..."
            sleep 2
          done

          echo ""
          echo "🗄️ Applying database migrations..."
          docker compose --env-file .env -f docker-compose.prod.yml \
            exec -T backend npx prisma migrate deploy

          echo "✅ Deployment complete"
          EOF

      - name: Post-Deployment Healthchecks
        env:
          DEPLOY_HOST: ${{ secrets.HETZNER_DEPLOY_HOST }}
        run: |
          echo "⏳ Waiting for services to be healthy..."
          sleep 10

          # Caddy de production n'écoute que 80/443 : interroger le port 8030
          # échouait systématiquement. On passe par le domaine, seule façon
          # d'obtenir le bon site (Caddy route sur l'en-tête Host).
          SITE="https://maisonnette-pecheur-bertheaume.fr"

          max_attempts=30
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            if curl -fsS "$SITE/api/health" > /dev/null 2>&1; then
              echo "✅ Backend health check passed"
              break
            fi
            if [ $attempt -eq $max_attempts ]; then
              echo "❌ Backend health check failed after $max_attempts attempts"
              exit 1
            fi
            echo "⏳ Attempt $attempt/$max_attempts..."
            sleep 2
            ((attempt++))
          done

          # Le backoffice doit répondre, sinon le site public est en ligne mais
          # l'administration est inaccessible sans que rien ne le signale.
          echo "✓ Testing backoffice login page..."
          if curl -fsS "$SITE/backoffice/login" | grep -q "Backoffice Login"; then
            echo "✅ Backoffice login page served"
          else
            echo "❌ Backoffice login page unreachable"
            exit 1
          fi

          # Check Google Calendar OAuth2 configuration
          echo "✓ Testing Google Calendar OAuth2 configuration..."
          calendar_response=$(curl -s "$SITE/api/calendar")
          if echo "$calendar_response" | grep -q "authUrl"; then
            if echo "$calendar_response" | grep -q "$DEPLOY_HOST/api/calendar/callback"; then
              echo "✅ Google Calendar REDIRECT_URI correctly configured"
            else
              echo "⚠️ Warning: REDIRECT_URI may not be correct"
            fi
          else
            echo "❌ Calendar endpoint not responding correctly"
            exit 1
          fi

          echo ""
          echo "========================================="
          echo "✅ ALL DEPLOYMENT CHECKS PASSED"
          echo "========================================="
