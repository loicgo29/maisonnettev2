[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alo"
version = "0.1.0"
description = "Application de gestion et répartition des dépenses familiales"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-telegram-bot>=21.0",
    "telethon>=1.35",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    # Pilote PostgreSQL : alo passe de SQLite à l'instance mutualisée du Mac
    # mini (schéma `alo`). SQLAlchemy gère les deux moteurs sans changement de
    # code, seul le pilote manquait.
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
