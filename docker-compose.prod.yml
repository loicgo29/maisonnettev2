# Site public maisonnette-pecheur-bertheaume.fr
#
# Volontairement ISOLÉ de l'écosystème NAS privé : ce compose crée son propre
# réseau et ne rejoint pas `nas-network`. Un site exposé à Internet ne doit pas
# partager de réseau Docker avec l'IDP, Immich ou Paperless.
#
# Caddy dédié avec Let's Encrypt (HTTPS automatique), distinct du Caddy interne
# de NAS-logo-UI qui tourne en `auto_https off` avec des certificats manuels.

services:
  postgres:
    image: postgres:16-alpine
    container_name: maisonnette-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [maisonnette]
    # Pas de `ports:` — la base n'est joignable que depuis le réseau interne.

  backend:
    build:
      context: ./backend
    container_name: maisonnette-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DOMAIN: ${DOMAIN}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      # Sans cette variable, oidc.ts lève au démarrage (voir son commentaire) :
      # mieux vaut un backend qui refuse de démarrer qu'un backend qui démarre
      # et rejette silencieusement tous les jetons en 401.
      KEYCLOAK_REALM_URL: ${KEYCLOAK_REALM_URL}
    volumes:
      # Les photos des gîtes doivent survivre aux reconstructions d'image.
      - uploads_data:/app/public/uploads
    ports:
      - '127.0.0.1:3001:3001'
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:3001/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [maisonnette]

  frontend:
    build:
      context: ./frontend
    container_name: maisonnette-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      # SvelteKit $env/static/private requires .env at runtime
      PRIVATE_GOOGLE_CLIENT_ID: "${PRIVATE_GOOGLE_CLIENT_ID}"
      PRIVATE_GOOGLE_CLIENT_SECRET: "${PRIVATE_GOOGLE_CLIENT_SECRET}"
      PRIVATE_GOOGLE_REDIRECT_URI: "${PRIVATE_GOOGLE_REDIRECT_URI}"
      PRIVATE_GITE_CALENDAR_ID: "${PRIVATE_GITE_CALENDAR_ID}"
      PUBLIC_AUTH_URL: "${PUBLIC_AUTH_URL}"
      PUBLIC_AUTH_REALM: "${PUBLIC_AUTH_REALM}"
      PUBLIC_AUTH_CLIENT_ID: "${PUBLIC_AUTH_CLIENT_ID}"
    networks: [maisonnette]

  # Point d'entrée du site, exposé UNIQUEMENT sur la boucle locale du Mac Mini.
  #
  # 127.0.0.1:8030 — seul un processus de la machine (cloudflared, qui tourne
  # nativement) peut l'atteindre. Ni le réseau local, ni Internet.
  # Le port 8030 suit la convention 80xx de l'écosystème (8020 nas-logo-api,
  # 8021/8022 alo) et était libre au moment de la mise en place.
  #
  # Ingress à déclarer dans le tunnel Cloudflare :
  #   maisonnette-pecheur-bertheaume.fr      -> http://localhost:8030
  #   www.maisonnette-pecheur-bertheaume.fr  -> http://localhost:8030
  caddy:
    build:
      context: ./caddy
    container_name: maisonnette-caddy
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - '8030:80'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [maisonnette]

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:

networks:
  maisonnette:
    driver: bridge
