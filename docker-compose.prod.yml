version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: maisonnettev2-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-maisonnette}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-maisonnettev2}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/loicgo29/maisonnettev2/backend:latest
    container_name: maisonnettev2-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-maisonnette}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-maisonnettev2}
      PORT: 3001
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - maisonnettev2-network

  frontend:
    image: ghcr.io/loicgo29/maisonnettev2/frontend:latest
    container_name: maisonnettev2-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=/api
    networks:
      - maisonnettev2-network
    depends_on:
      - backend

  caddy:
    image: caddy:latest-alpine
    container_name: maisonnettev2-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-maisonnettev2.local}
    networks:
      - maisonnettev2-network
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  maisonnettev2-network:
    driver: bridge
