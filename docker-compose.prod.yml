# Hetzner Production Deployment
#
# Trois volets:
# 1. Site public statique (HTML pur) — zéro risque d'injection
# 2. Backoffice privé (SvelteKit + Express) — simple auth JWT
# 3. Infrastructure: PostgreSQL + Caddy (reverse proxy avec Let's Encrypt)
#
# Architecture de sécurité:
# - Public site sur sous-domaine: maisonnette.fr
# - Backoffice sur sous-domaine privé: backoffice.maisonnette.fr (DNS en internal VPN seulement)
# - Caddy gère TLS/HTTPS automatiquement via Let's Encrypt
# - PostgreSQL n'est pas exposé (réseau interne Docker)

services:
  postgres:
    image: postgres:16-alpine
    container_name: maisonnette-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: maisonnettev2
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant}
      POSTGRES_DB: maisonnettev2
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U maisonnettev2']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [maisonnette]

  backend:
    # Image publiée par la CI plutôt que construite ici : le serveur n'a que
    # deux cœurs, et bâtir sur place l'a saturé au point de couper la session de
    # déploiement (load > 90, « Broken pipe »). La CI construit une fois, le
    # serveur se contente de tirer.
    image: ${BACKEND_IMAGE:-ghcr.io/loicgo29/maisonnettev2-backend:latest}
    container_name: maisonnette-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # ── Configuration ──────────────────────────────────────────────
      # Versionnée : ces valeurs ne sont pas secrètes, et les cacher dans un
      # fichier généré au déploiement les rendait invisibles en revue — c'est
      # ainsi qu'une URL de realm Authentik a survécu des semaines.
      NODE_ENV: production
      PORT: 3001
      PUBLIC_ORIGIN: https://maisonnette-pecheur-bertheaume.fr
      OWNER_EMAIL: lgbertheaume@gmail.com
      OWNER_PHONE: '+33781103889'
      MESSAGES_AUTO: 'false'
      # Keycloak n'est pas encore déployé : ce sous-domaine ne résout pas. La
      # valeur est correcte pour le jour où il le sera, et oidc.ts n'exige que
      # sa présence au démarrage, pas sa joignabilité.
      KEYCLOAK_REALM_URL: https://auth.maisonnette-pecheur-bertheaume.fr/realms/maisonnettev2
      # Identifiant OAuth public : déjà exposé dans l'authUrl de /api/calendar.
      PRIVATE_GOOGLE_CLIENT_ID: 775094963614-ajspquocfsq0e5qpnlfm0leniia83iij.apps.googleusercontent.com
      PRIVATE_GOOGLE_REDIRECT_URI: https://maisonnette-pecheur-bertheaume.fr/api/calendar/callback

      # ── Secrets ────────────────────────────────────────────────────
      # `:?` plutôt qu'une valeur vide : un déploiement doit échouer net s'il
      # manque un secret, pas démarrer sur une chaîne vide. JWT_SECRET absent a
      # fait boucler le backend en production le 6 septembre.
      DATABASE_URL: postgresql://maisonnettev2:${DB_PASSWORD:?DB_PASSWORD manquant}@postgres:5432/maisonnettev2
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant}
      PRIVATE_GOOGLE_CLIENT_SECRET: ${PRIVATE_GOOGLE_CLIENT_SECRET:-}
      PRIVATE_GITE_CALENDAR_ID: ${PRIVATE_GITE_CALENDAR_ID:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    ports:
      - '127.0.0.1:3001:3001'
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:3001/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [maisonnette]

  backoffice:
    # Construite par la CI avec les build args de production : SvelteKit fige
    # l'URL de Keycloak et le realm dans le paquet, ils ne peuvent pas être
    # corrigés au démarrage.
    image: ${BACKOFFICE_IMAGE:-ghcr.io/loicgo29/maisonnettev2-frontend:latest}
    container_name: maisonnette-backoffice
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '127.0.0.1:5173:5173'
    healthcheck:
      # wget et non curl : l'image du backoffice n'embarque pas curl, et le
      # test tombait sur « executable file not found », marquant en permanence
      # un service parfaitement fonctionnel comme unhealthy.
      # 127.0.0.1 et non localhost : le serveur n'écoute qu'en IPv4
      # (0.0.0.0:5173) alors que localhost résout d'abord ::1, d'où un
      # « Connection refused » trompeur.
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:5173/']
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [maisonnette]

  public:
    image: nginx:alpine
    container_name: maisonnette-public
    restart: unless-stopped
    volumes:
      - ./public-site:/usr/share/nginx/html:ro
      - ./nginx-public.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '127.0.0.1:8040:80'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:80/']
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [maisonnette]

  # ── meteo-marine — widget météo/marée du site public ───────────────────
  # Régénère les prévisions (Open-Meteo + api-maree.fr) et republie le
  # widget dans public-site/index.html toutes les heures, entre des
  # marqueurs HTML dédiés (voir meteo-marine/src/publish.ts). Le site public
  # reste 100% statique côté nginx : ce conteneur est le seul à écrire dans
  # ce volume, jamais le service `public`.
  meteo-marine:
    image: ${METEO_MARINE_IMAGE:-ghcr.io/loicgo29/maisonnettev2-meteo-marine:latest}
    container_name: maisonnette-meteo-marine
    restart: unless-stopped
    environment:
      MAREE_API_KEY: ${MAREE_API_KEY:?MAREE_API_KEY manquant}
      PUBLISH_TARGET: /app/public-site/index.html
    volumes:
      - ./public-site:/app/public-site
    networks: [maisonnette]

  # ── alo — comptabilité familiale ──────────────────────────────────────
  # Servie derrière l'authentification du backoffice, comme en local (voir
  # Caddyfile, bloc alo.{$DOMAIN}). Lit la copie du schéma `alo` hébergée
  # dans le Postgres de maisonnettev2.
  #
  # Code source rapatrié dans ce repo (alo-backend/, alo-frontend/) le
  # 2026-09-07 : le dépôt alo séparé avait sa CI cassée depuis des semaines et
  # n'a donc jamais publié d'image sur un registre. Les images sont désormais
  # buildées et publiées par la CI de maisonnettev2, sous son propre
  # namespace GHCR. Le dépôt alo original n'est plus la source de vérité.
  alo-backend:
    image: ${ALO_BACKEND_IMAGE:-ghcr.io/loicgo29/maisonnettev2-alo-backend:latest}
    container_name: maisonnette-alo-backend
    restart: unless-stopped
    environment:
      # `search_path` est le seul mécanisme par lequel alo choisit son schéma :
      # rien dans son code Python ne le qualifie.
      DATABASE_URL: postgresql+psycopg2://maisonnettev2:${DB_PASSWORD:?DB_PASSWORD manquant}@postgres:5432/maisonnettev2?options=-csearch_path%3Dalo
      API_HOST: 0.0.0.0
      API_PORT: 8000
      ENVIRONMENT: production
      DEBUG: 'false'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - alo_data:/app/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:8000/docs']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [maisonnette]

  alo-frontend:
    image: ${ALO_FRONTEND_IMAGE:-ghcr.io/loicgo29/maisonnettev2-alo-frontend:latest}
    container_name: maisonnette-alo-frontend
    restart: unless-stopped
    depends_on:
      - alo-backend
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:80/']
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [maisonnette]

  backup:
    image: postgres:16-alpine
    container_name: maisonnette-backup
    restart: daily
    environment:
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant}
    volumes:
      - ./backups:/backups
      - postgres_data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: |
      sh -c 'mkdir -p /backups && exec 2>/backups/backup.log
      while true; do
        echo "[$(date)] Starting backup..."
        pg_dump -h postgres -U maisonnettev2 maisonnettev2 2>/backups/backup.log | gzip > /backups/db-$(date +%Y%m%d-%H%M%S).sql.gz
        echo "[$(date)] Backup complete. Cleaning old backups (>7 days)..."
        find /backups -name "db-*.sql.gz" -mtime +7 -delete
        echo "[$(date)] Sleeping 24 hours until next backup..."
        sleep 86400
      done'
    networks: [maisonnette]
    profiles:
      - backup

  # ── Fournisseur d'identité ────────────────────────────────────────────
  # Keycloak, et non Authentik : le projet idp/ fait tourner Keycloak 24, et la
  # documentation qui annonçait Authentik a été corrigée le 2026-09-07.
  #
  # Il partage le PostgreSQL de maisonnettev2, dans une base dédiée : un second
  # moteur coûterait ~200 Mo de mémoire et une routine de sauvegarde de plus,
  # pour une isolation que deux bases assurent déjà.
  keycloak:
    # 26.0 : la version déjà présente sur le serveur. Tirer une 24.0 coûterait
    # 700 Mo sur les 6 Go restants, pour une version plus ancienne.
    # ⚠️ Le Keycloak local (projet idp/) tourne encore en 24 — divergence à
    # résorber, une différence de version majeure entre développement et
    # production finit toujours par surprendre.
    image: quay.io/keycloak/keycloak:26.0
    container_name: maisonnette-keycloak
    restart: unless-stopped
    # `start` sans --optimized : cette option suppose une image reconstruite
    # avec `kc.sh build`, sinon le démarrage échoue. Le coût est quelques
    # secondes de plus au lancement.
    command: start --http-enabled=true --proxy-headers=xforwarded
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD manquant}
      KC_HOSTNAME: auth.maisonnette-pecheur-bertheaume.fr
      # Caddy termine le TLS en amont : sans cette indication, Keycloak fabrique
      # ses URL de redirection en http et le navigateur refuse le flux.
      KC_HOSTNAME_STRICT_HTTPS: 'true'
      KC_HTTP_ENABLED: 'true'
      KC_HEALTH_ENABLED: 'true'
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?KC_ADMIN_PASSWORD manquant}
      # La JVM prend 1 Go si on la laisse faire, sur un serveur qui n'en a que
      # 3,7 au total. 512 Mo suffisent largement pour un usage familial.
      JAVA_OPTS_APPEND: -Xms256m -Xmx512m
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # L'image Keycloak n'embarque ni curl ni wget : on se contente d'ouvrir
      # une connexion sur le port applicatif, ce que bash sait faire seul.
      test: ['CMD-SHELL', 'exec 3<>/dev/tcp/127.0.0.1/8080']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks: [maisonnette]

  caddy:
    image: caddy:latest
    container_name: maisonnette-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./logs:/var/log/caddy
    environment:
      ACME_AGREE: 'true'
      # Le Caddyfile lit {$DOMAIN} et {$ACME_EMAIL}. Sans ces deux lignes, la
      # substitution donne une directive `email` sans argument et Caddy refuse
      # de démarrer, laissant le site entier injoignable.
      DOMAIN: maisonnette-pecheur-bertheaume.fr
      ACME_EMAIL: loic@logo-solutions.fr
    depends_on:
      - backend
      - backoffice
      - public
      - keycloak
      - alo-frontend
    networks: [maisonnette]

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  maisonnettev2_logs:
  # Session Telegram et règles de catégorisation apprises par alo.
  alo_data:

networks:
  maisonnette:
    driver: bridge
