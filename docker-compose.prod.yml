# Hetzner Production Deployment
#
# Trois volets:
# 1. Site public statique (HTML pur) — zéro risque d'injection
# 2. Backoffice privé (SvelteKit + Express) — simple auth JWT
# 3. Infrastructure: PostgreSQL + Caddy (reverse proxy avec Let's Encrypt)
#
# Architecture de sécurité:
# - Public site sur sous-domaine: maisonnette.fr
# - Backoffice sur sous-domaine privé: backoffice.maisonnette.fr (DNS en internal VPN seulement)
# - Caddy gère TLS/HTTPS automatiquement via Let's Encrypt
# - PostgreSQL n'est pas exposé (réseau interne Docker)

services:
  postgres:
    image: postgres:16-alpine
    container_name: maisonnette-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-maisonnettev2}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-maisonnettev2}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-maisonnettev2}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [maisonnette]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maisonnette-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${DB_USER:-maisonnettev2}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-maisonnettev2}
      JWT_SECRET: ${JWT_SECRET}
      OWNER_EMAIL: ${OWNER_EMAIL}
      OWNER_PHONE: ${OWNER_PHONE}
      # src/middleware/oidc.ts refuse de se charger sans cette URL — le
      # conteneur repartait en boucle sur « KEYCLOAK_REALM_URL est absente ».
      # Elle est produite par le workflow dans .env.production.
      KEYCLOAK_REALM_URL: ${KEYCLOAK_REALM_URL}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      MESSAGES_AUTO: ${MESSAGES_AUTO:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      PRIVATE_GOOGLE_CLIENT_ID: ${PRIVATE_GOOGLE_CLIENT_ID:-}
      PRIVATE_GOOGLE_CLIENT_SECRET: ${PRIVATE_GOOGLE_CLIENT_SECRET:-}
      PRIVATE_GOOGLE_REDIRECT_URI: ${PRIVATE_GOOGLE_REDIRECT_URI:-}
      PRIVATE_GITE_CALENDAR_ID: ${PRIVATE_GITE_CALENDAR_ID:-}
    ports:
      - '127.0.0.1:3001:3001'
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:3001/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [maisonnette]

  backoffice:
    build:
      context: ./frontend
      dockerfile: Dockerfile.nginx
    container_name: maisonnette-backoffice
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '127.0.0.1:5173:5173'
    healthcheck:
      # wget et non curl : l'image du backoffice n'embarque pas curl, et le
      # test tombait sur « executable file not found », marquant en permanence
      # un service parfaitement fonctionnel comme unhealthy.
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:5173/']
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [maisonnette]

  public:
    image: nginx:alpine
    container_name: maisonnette-public
    restart: unless-stopped
    volumes:
      - ./public-site:/usr/share/nginx/html:ro
      - ./nginx-public.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '127.0.0.1:8040:80'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:80/']
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [maisonnette]

  backup:
    image: postgres:16-alpine
    container_name: maisonnette-backup
    restart: daily
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./backups:/backups
      - postgres_data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: |
      sh -c 'mkdir -p /backups && exec 2>/backups/backup.log
      while true; do
        echo "[$(date)] Starting backup..."
        pg_dump -h postgres -U ${DB_USER:-maisonnettev2} ${DB_NAME:-maisonnettev2} 2>/backups/backup.log | gzip > /backups/db-$(date +%Y%m%d-%H%M%S).sql.gz
        echo "[$(date)] Backup complete. Cleaning old backups (>7 days)..."
        find /backups -name "db-*.sql.gz" -mtime +7 -delete
        echo "[$(date)] Sleeping 24 hours until next backup..."
        sleep 86400
      done'
    networks: [maisonnette]
    profiles:
      - backup

  caddy:
    image: caddy:latest
    container_name: maisonnette-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./logs:/var/log/caddy
    environment:
      ACME_AGREE: 'true'
      # Le Caddyfile lit {$DOMAIN} et {$ACME_EMAIL}. Sans ces deux lignes, la
      # substitution donne une directive `email` sans argument et Caddy refuse
      # de démarrer, laissant le site entier injoignable.
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    depends_on:
      - backend
      - backoffice
      - public
    networks: [maisonnette]

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  maisonnettev2_logs:

networks:
  maisonnette:
    driver: bridge
