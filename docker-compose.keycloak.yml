# Keycloak — fournisseur d'identité du backoffice.
#
# Usage (en complément des deux autres fichiers) :
#   docker compose -f docker-compose.prod.yml \
#                  -f docker-compose.hetzner.yml \
#                  -f docker-compose.keycloak.yml up -d
#
# Hébergé à côté de l'application plutôt qu'au Mac mini : le backoffice est un
# service public, le faire dépendre d'une connexion domestique reviendrait à
# perdre l'accès administrateur à chaque coupure de box.
#
# Keycloak est une JVM : prévoir ~700 Mo. Le serveur dispose de 2,9 Go et d'un
# swap de 2 Go ajouté le 2026-08-29 — sans ce filet, un pic mémoire ferait
# tuer un processus par le noyau au lieu de ralentir.

services:
  keycloak-db:
    image: postgres:16-alpine
    container_name: maisonnette-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD doit être défini}
      POSTGRES_DB: keycloak
    volumes:
      # Sur le volume persistant : les comptes et les rôles survivent à la
      # destruction du serveur.
      - /donnees/keycloak-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U keycloak']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [maisonnette]
    # Base séparée de celle de l'application : un incident sur l'une ne doit
    # pas emporter l'autre, et les sauvegardes ont des rythmes différents.

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: maisonnette-keycloak
    restart: unless-stopped
    depends_on:
      keycloak-db:
        condition: service_healthy
    # Pas de `--optimized` : ce drapeau suppose une image déjà construite par
    # `kc.sh build` et fait échouer le tout premier démarrage. Keycloak
    # construit sa configuration au lancement, ce qui coûte une trentaine de
    # secondes au démarrage — acceptable pour un service qui redémarre rarement.
    command: start
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}

      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?KC_ADMIN_PASSWORD doit être défini}

      KC_HOSTNAME: https://auth.maisonnette-pecheur-bertheaume.fr
      # Caddy termine le TLS et transmet X-Forwarded-Proto : sans ce réglage,
      # Keycloak génère des URL en http et les redirections OIDC échouent.
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: 'true'
      KC_HEALTH_ENABLED: 'true'

      # La JVM par défaut réserve trop pour ce serveur. On la borne pour
      # laisser respirer l'application, qui reste la priorité.
      JAVA_OPTS_APPEND: '-Xms256m -Xmx640m'
    # Aucun port publié : Caddy l'atteint par le réseau Docker interne.
    healthcheck:
      test: ['CMD-SHELL', "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks: [maisonnette]
