#cloud-config
# Prépare le serveur au premier démarrage : Docker, utilisateur de déploiement,
# volume de données monté, durcissement SSH.

users:
  - name: ${utilisateur}
    # Pas de groupe `docker` ici : il n'existe pas encore à la création de
    # l'utilisateur, Docker n'étant installé que dans runcmd. Le demander
    # maintenant fait échouer la création du compte sur certaines versions de
    # cloud-init — et laisse le serveur sans accès SSH. L'ajout au groupe se
    # fait après l'installation (`usermod -aG docker` plus bas).
    groups: [sudo]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ${cle_ssh}

# Le durcissement SSH par sed + systemctl restart a coupé l'accès au serveur
# lors du premier essai (2026-08-29) : sshd ne réécoutait plus, et la machine
# est devenue injoignable, cloud-init ne rejouant pas au redémarrage.
# On s'en remet donc aux réglages natifs de cloud-init, appliqués avant que
# sshd ne démarre, plutôt qu'à une modification a posteriori.
disable_root: true
ssh_pwauth: false

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - ufw
  - fail2ban
  - postgresql-client
  - unattended-upgrades

write_files:
  # Le pare-feu Hetzner filtre déjà en amont ; ufw est une seconde barrière au
  # cas où une règle cloud serait relâchée par erreur.
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

runcmd:
  # --- Docker depuis le dépôt officiel ---
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  - usermod -aG docker ${utilisateur}

  # --- Volume de données ---
  # Le volume est attaché APRÈS la création du serveur : au premier démarrage,
  # le périphérique peut ne pas encore exister. On l'attend jusqu'à 120 s.
  # Sans cette attente, mkfs et mount échouent, et PostgreSQL écrirait sur le
  # disque éphémère du serveur — silencieusement, jusqu'à la première
  # destruction de la machine.
  - |
    for i in $(seq 1 60); do
      [ -b ${volume_device} ] && break
      sleep 2
    done
    if [ ! -b ${volume_device} ]; then
      echo "ERREUR: volume ${volume_device} absent après 120 s" | tee /donnees-VOLUME-ABSENT
      exit 1
    fi
  # blkid échoue sur un volume sans système de fichiers : c'est le signal qu'il
  # faut le formater. Sur un volume déjà rempli (serveur recréé), on se contente
  # de le monter — le formater détruirait la base.
  - blkid ${volume_device} || mkfs.ext4 -F ${volume_device}
  - mkdir -p /donnees
  - echo "${volume_device} /donnees ext4 discard,nofail,defaults 0 0" >> /etc/fstab
  - mount /donnees
  # Garde-fou : vérifier que /donnees est bien le volume et non le disque
  # système. Un montage silencieusement raté placerait la base au mauvais
  # endroit, ce qui ne se verrait qu'au moment de recréer le serveur.
  # Bloc littéral obligatoire : une commande commençant par « { » et contenant
  # un « : » est interprétée par YAML comme un dictionnaire, pas une chaîne.
  # cloud-init rejette alors TOUT le bloc runcmd — constaté le 2026-08-29.
  - |
    if ! mountpoint -q /donnees; then
      echo "ERREUR: /donnees n'est pas un point de montage" | tee /donnees-NON-MONTE
      exit 1
    fi
  - mkdir -p /donnees/postgres /donnees/uploads /donnees/sauvegardes /donnees/caddy
  - chown -R ${utilisateur}:${utilisateur} /donnees

  # --- Répertoire applicatif ---
  - mkdir -p /opt/maisonnettev2
  - chown -R ${utilisateur}:${utilisateur} /opt/maisonnettev2

  # --- ufw ---
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable

  - systemctl enable --now fail2ban

final_message: "Serveur prêt après $UPTIME s — Docker installé, volume monté sur /donnees"
